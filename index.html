<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAnggara</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 680px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--muted); margin-bottom: 1.75rem; line-height: 1.6; }
    .links { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    a.btn {
      display: inline-block;
      padding: 0.6rem 1.1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      transition: background 0.15s ease;
    }
    a.btn:hover { background: rgba(88, 166, 255, 0.1); }
  </style>
</head>
<body>
  <main class="container">
    <h1>KAnggara</h1>
    <p class="subtitle">
      Infrastructure, DevOps, Kubernetes GitOps, and Cloud-Native Engineering.
    </p>
    <div class="links">
      <a class="btn" href="https://github.com/KAnggara">GitHub Organization</a>
      <a class="btn" href="https://github.com/KAnggara/DevOps">DevOps Actions</a>
      <a class="btn" href="https://github.com/KAnggara/KubeClaw">KubeClaw</a>
    </div>
  </main>
</body>
</html>
